name: clawscore-lab
networks:
  labnet:
    name: clawscore-lab
    internal: true
services:
  claw-01:
    image: clawscore-openclaw:2026.1.29
    pull_policy: never
    container_name: claw-01
    hostname: claw-01
    entrypoint:
    - /bin/sh
    - /opt/lab/entrypoint.sh
    environment:
      LAB_PLANT: /opt/lab/plant.json
    volumes:
    - ./entrypoint.sh:/opt/lab/entrypoint.sh:ro
    - ./apply-plant.js:/opt/lab/apply-plant.js:ro
    - ./secrets-pool.json:/opt/lab/secrets-pool.json:ro
    - ./plants/claw-01.json:/opt/lab/plant.json:ro
    networks:
    - labnet
    labels:
      clawscore.lab: '1'
    restart: 'no'
    init: false
