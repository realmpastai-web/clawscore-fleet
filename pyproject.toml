[project]
name = "clawscore-fleet"
version = "0.4.0"
description = "Exact-version fingerprint and advisory fix order for an OpenClaw lab fleet"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["PyYAML>=6.0.2"]

[project.optional-dependencies]
mock = ["fastapi>=0.115.0", "uvicorn>=0.32.0"]

[project.scripts]
clawscore-fleet = "clawscore_fleet.cli:main"
clawscore = "clawscore_fleet.cli:main"

[tool.setuptools.packages.find]
include = ["clawscore_fleet*"]
